# Render Blueprint — the two NestJS services behind the hosted portals.
# Step-by-step: DEPLOY.md → "Going live".
#
# Free plan: a service sleeps after ~15 idle minutes and takes ~1 minute to
# wake. Supabase's email hook gives up long before that, so keep
# nexraah-internal-api awake (a free pinger on /api/v1/health every 10 minutes)
# or put it on a paid plan. The free allowance (750 hours a month) keeps one
# service awake all month, not two — let nexraah-vendor-api sleep.
#
# New → Blueprint → pick this repo. Render creates both services and asks
# for every `sync: false` value below; paste them from the staging env sheet.
# Both portals stay on Vercel (see DEPLOY.md); only the APIs live here.
#
# internal-api is the only process that holds database credentials.
# vendor-api is the transporter edge: it forwards /portal/* to internal-api
# with the shared service key and must never receive a DATABASE_URL or any
# SUPABASE_* value (docs/specs/internal-spec/14-supabase-setup.md §9).
services:
  - type: web
    name: nexraah-internal-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter internal-api... && pnpm --filter internal-api build
    startCommand: node apps/internal-api/dist/src/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: STORAGE_BUCKET
        value: nexraah
      - key: DATABASE_URL_INTERNAL
        sync: false
      - key: DATABASE_URL_PORTAL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: PORTAL_SERVICE_KEY
        sync: false
      # Uploaded files (PODs, bills, KYC papers): Supabase Storage's own S3
      # access keys — Storage → S3 Connection. They reach the bucket and not the
      # database, which is why they are used rather than the service_role key
      # (apps/internal-api/src/lib/object-store.ts).
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_REGION
        value: ap-south-1
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # Sign-in codes by email: Supabase Auth's "Send Email" hook calls
      # POST /api/v1/auth/email-hook here, and the code goes out through Brevo
      # when BREVO_API_KEY is set (no domain needed — a verified sender address
      # is enough), otherwise through Resend.
      # SEND_EMAIL_HOOK_SECRET is the secret Supabase shows when the hook is made.
      - key: SEND_EMAIL_HOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_LOGO_URL
        value: https://nexraah-mono-repo.vercel.app/nexraah-logo.png
      # Notifications (awards, payments, POD deadlines, approvals) by email
      # through Brevo or Resend above, and as free browser notifications once the VAPID
      # pair is set — `node supabase/scripts/push-keys.mjs` makes it.
      - key: PORTAL_PUBLIC_URL
        sync: false
      - key: CONSOLE_PUBLIC_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional, and paid: Anthropic's reader for "Fetch" and the assistant.
      # Left empty, Fetch reads documents in the browser for free and the
      # assistant answers from the records by rule (assistant.local.ts).
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: nexraah-vendor-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter vendor-api... && pnpm --filter vendor-api build
    startCommand: node apps/vendor-api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: nexraah-internal-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        value: https://nexraah-mono-repo-vendor-portal.vercel.app
      - key: PORTAL_SERVICE_KEY
        sync: false
